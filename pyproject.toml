[project]
name = "switch-dashboard"
version = "2.0.0"
description = "Network Switch Monitoring Dashboard"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=2.3",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "PyYAML>=6.0",
    "paramiko>=3.0",
    "scapy>=2.5.0",
    "voluptuous>=0.16.0",
    "pysnmp>=7.1.21",
    "aiohttp>=3.9",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "joserfc>=1.0.0",
    "cryptography>=43.0.0",
    "gunicorn>=23.0.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
]
