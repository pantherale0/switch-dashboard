        const otherPortLabel = isSource ? link.target_port : link.source_port;

        html += `
          <div style="background: rgba(13, 17, 23, 0.4); border: 1px solid rgba(48, 54, 61, 0.3); border-radius: 6px; padding: 8px; margin-bottom: 6px; font-size: 11px;">
            <div style="display: flex; justify-content: space-between; font-weight: 600; color: #f0f6fc;">
              <span>${escapeHtml(otherNode.name)}</span>
              <span style="color: #58a6ff;">${escapeHtml(link.speed)}</span>
            </div>
            <div style="color: #8b949e; margin-top: 4px; display: flex; justify-content: space-between;">
              <span>${escapeHtml(portLabel ? portLabel : 'Direct')}</span>
              <span>${escapeHtml(otherPortLabel ? otherPortLabel : '')}</span>
            </div>
          </div>
        `;
      });
      html += `</div>`;
    }

    card.innerHTML = html;
  }

  // ==========================================
  // TOOLTIPS FOR LINKS
  // ==========================================
  const tooltip = document.getElementById('link-tooltip');

  function showLinkTooltip(e, link, source, target) {
    let speedColor = '#8b949e';
    if (link.speed.includes('10G')) speedColor = '#1f6feb';
    else if (link.speed.includes('2.5G')) speedColor = '#58a6ff';
    else if (link.speed.includes('1G') || link.speed.includes('1000M')) speedColor = '#3fb950';
    else if (link.speed.includes('100M')) speedColor = '#f08a24';

    let trafficHtml = '';
    if (link.tx_bps || link.rx_bps || link.tx_bytes || link.rx_bytes || link.utilization_pct !== undefined) {
      const util = Math.max(0, Math.min(100, Number(link.utilization_pct) || 0));
      const barColor = util >= 80 ? '#ef4444' : (util >= 50 ? '#f59e0b' : '#3fb950');
      let bytesHtml = '';
      if (link.tx_bytes || link.rx_bytes) {
        bytesHtml = `
          <div class="row" style="margin-top: 4px; border-top: 1px dashed rgba(48, 54, 61, 0.4); padding-top: 4px;">
            <span>TX Bytes:</span>
            <span class="val blue mono">${formatResourceBytes(link.tx_bytes || 0)}</span>
          </div>
          <div class="row">
            <span>RX Bytes:</span>
            <span class="val green mono">${formatResourceBytes(link.rx_bytes || 0)}</span>
          </div>
        `;
      }
      trafficHtml = `
        <div class="row" style="margin-top: 4px; border-top: 1px dashed rgba(48, 54, 61, 0.4); padding-top: 4px;">
          <span>TX Speed:</span>
          <span class="val blue">${formatTraffic(link.tx_bps || 0)}</span>
        </div>
        <div class="row">
          <span>RX Speed:</span>
          <span class="val green">${formatTraffic(link.rx_bps || 0)}</span>
        </div>
        ${bytesHtml}
        <div class="row" style="margin-top: 4px;">
          <span>Utilization:</span>
          <span class="val" style="color: ${barColor}">${util.toFixed(1)}%</span>
        </div>
        <div style="background: rgba(48, 54, 61, 0.5); height: 4px; border-radius: 2px; margin-top: 4px; overflow: hidden;">
          <div style="background: ${barColor}; width: ${Math.min(util, 100)}%; height: 100%;"></div>
        </div>
      `;
    }

    tooltip.innerHTML = `
      <div class="title">
        <span>Connection Link</span>
        <span style="color: ${speedColor}">${escapeHtml(link.speed)}</span>
      </div>
      <div class="row">
        <span>Source:</span>
        <span class="val">${escapeHtml(source.name)}</span>
      </div>
      ${link.source_port ? `<div class="row"><span>Port:</span><span class="val">${escapeHtml(link.source_port)}</span></div>` : ''}
      <div class="row" style="margin-top: 4px;">
        <span>Destination:</span>
        <span class="val">${escapeHtml(target.name)}</span>
      </div>
      ${link.target_port ? `<div class="row"><span>Port:</span><span class="val">${escapeHtml(link.target_port)}</span></div>` : ''}
      ${trafficHtml}
    `;
    tooltip.style.display = 'block';
    moveLinkTooltip(e);
  }

  function moveLinkTooltip(e) {
    // Position floating tooltip near cursor
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY + 14) + 'px';
  }

  function hideLinkTooltip() {
    tooltip.style.display = 'none';
  }

  function formatTraffic(bps) {
    bps = Number(bps) || 0;
    if (!bps) return '0 bps';
    if (bps >= 1000000000) return (bps / 1000000000).toFixed(1) + ' Gbps';
    if (bps >= 1000000) return (bps / 1000000).toFixed(1) + ' Mbps';
    if (bps >= 1000) return (bps / 1000).toFixed(1) + ' Kbps';
    return bps + ' bps';
  }

  function formatResourceBytes(bytes) {
    const value = Number(bytes) || 0;
    if (value >= 1099511627776) return `${(value / 1099511627776).toFixed(1)} TiB`;
    if (value >= 1073741824) return `${(value / 1073741824).toFixed(1)} GiB`;
    if (value >= 1048576) return `${(value / 1048576).toFixed(1)} MiB`;
    if (value >= 1024) return `${(value / 1024).toFixed(1)} KiB`;
    return `${value} B`;
  }

  // ==========================================
  // SEARCH & HIGHLIGHT
  // ==========================================
  let activeHighlightTimer = null;

  function handleSearchInput(query) {
    const suggestionsPanel = document.getElementById('search-suggestions');
    if (!query.trim()) {
      suggestionsPanel.style.display = 'none';
      return;
    }
    
    const q = query.toLowerCase();
    const matches = rawNodes.filter(n => {
      return (n.name && n.name.toLowerCase().includes(q)) ||
             (n.mac && n.mac.toLowerCase().includes(q.replace(/:/g, ''))) ||
             (n.ip && n.ip.toLowerCase().includes(q)) ||
             (n.vendor && n.vendor.toLowerCase().includes(q)) ||
             (n.native_id && String(n.native_id).toLowerCase().includes(q)) ||
             (n.node && n.node.toLowerCase().includes(q)) ||
             (n.cluster_name && n.cluster_name.toLowerCase().includes(q));
    });

    if (matches.length === 0) {
      suggestionsPanel.replaceChildren();
      const empty = document.createElement('div');
      empty.style.padding = '8px 12px';
      empty.style.fontSize = '11px';
      empty.style.color = '#8b949e';
      empty.textContent = 'No devices found';
      suggestionsPanel.appendChild(empty);
      suggestionsPanel.style.display = 'block';
      return;
    }

    suggestionsPanel.replaceChildren();
    matches.slice(0, 5).forEach(node => {
      const item = document.createElement('div');
      item.className = 'search-suggestion-item';
      item.addEventListener('click', () => triggerDeviceHighlight(node.id));

      const primary = document.createElement('span');
      primary.appendChild(document.createTextNode(node.name || ''));
      const detail = document.createElement('span');
      detail.style.fontSize = '10px';
      detail.style.color = '#8b949e';
      detail.style.marginLeft = '6px';
      const detailValue = node.type === 'switch' ? node.ip : (node.type === 'ont' ? (node.speed || 'ONT') : (node.type === 'unmanaged_switch' || node.type === 'phone' ? formatPortDisplay(node.parent_port) : (node.type === 'internet' ? 'WAN' : formatMacAddress(node.mac))));
      detail.textContent = `(${detailValue || ''})`;
      primary.appendChild(detail);
      item.appendChild(primary);

      const type = document.createElement('span');
      type.className = 'type';
      type.textContent = node.type || '';
      item.appendChild(type);
      suggestionsPanel.appendChild(item);
    });
    suggestionsPanel.style.display = 'block';
  }

  function triggerDeviceHighlight(nodeId) {
    // Hide suggestions
    document.getElementById('search-suggestions').style.display = 'none';
    document.getElementById('search-input').value = '';

    const node = rawNodes.find(n => n.id === nodeId);
    if (!node) return;

    // Center map view on this node
    const containerWidth = canvasContainer.clientWidth;
    const containerHeight = canvasContainer.clientHeight;
    
    panX = containerWidth / 2 - node.x;
    panY = containerHeight / 2 - node.y;
    zoomScale = 1.1; // zoom in slightly
    updateViewportTransform();

    // Select the node in details panel
    selectNode(node);

    // Trigger visual pulse ring
    const pulseRing = document.getElementById(`highlight-${node.id}`);
    if (pulseRing) {
      pulseRing.style.display = 'block';
      
      if (activeHighlightTimer) clearTimeout(activeHighlightTimer);
      activeHighlightTimer = setTimeout(() => {
        pulseRing.style.display = 'none';
      }, 5000);
    }
  }

  async function resetLayout() {
    if (!confirm("Are you sure you want to reset the map layout? This will clear all custom device coordinates and cannot be undone.")) {
      return;
    }
    for (let key in positionCache) {
      delete positionCache[key];
    }
    try {
      await fetch('/api/config/settings', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ map_positions: {} })
      });
    } catch (e) {
      console.error("Failed to clear map coordinates on server:", e);
    }
    processAndRender();
  }

  async function updateClientHost(mac, host) {
    try {
      await fetch('/api/clients/update_host', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ mac: mac, host: host })
      });
      fetchTopology();
    } catch (e) {
      console.error("Failed to update client host:", e);
    }
  }

  async function updateClientType(mac, type) {
    try {
      await fetch('/api/clients/update_type', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ mac: mac, type: type })
      });
      if (selectedNode && selectedNode.id === mac) {
        selectedNode.device_type = type;
      }
      fetchTopology();
    } catch (e) {
      console.error("Failed to update client type:", e);
    }
  }

  async function updateClientPassthrough(mac, isMiniSwitch) {
    try {
      await fetch('/api/clients/update_passthrough', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ mac: mac, is_mini_switch: isMiniSwitch })
      });
      if (selectedNode && (selectedNode.id === mac || selectedNode.mac === mac)) {
        selectedNode.is_mini_switch = isMiniSwitch;
      }
      fetchTopology();
    } catch (e) {
      console.error("Failed to update client passthrough setting:", e);
    }
  }

  async function forgetClient(mac) {
    if (!confirm("Are you sure you want to forget and remove this client device?")) {
      return;
    }
    try {
      await fetch('/api/clients/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ mac: mac })
      });
      toggleSidebar(false);
      delete positionCache[mac];
      fetchTopology();
    } catch (e) {
      console.error("Failed to forget client:", e);
    }
  }

  // Dismiss suggestions when clicking outside search
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-box')) {
      document.getElementById('search-suggestions').style.display = 'none';
    }
  });

  // ==========================================
  // INITIALIZE AND AUTO-POLL
  // ==========================================
  let countdownSeconds = 10;
  let countdownInterval = null;

  function startCountdown() {
    if (countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
      const liveText = document.getElementById('live-text');
      const liveDot = document.getElementById('live-dot');
      if (!liveText || !liveDot) return;
      
      const activeEl = document.activeElement;
      const isInteracting = activeEl && (
        activeEl.id === 'inspect-host-input' || 
        activeEl.id === 'inspect-type-select' ||
        activeEl.id === 'inspect-mini-switch-checkbox'
      );
      
      if (isInteracting) {
        liveText.textContent = 'Paused';
        liveDot.className = 'dot paused';
        return;
      }
      
      countdownSeconds--;
      if (countdownSeconds <= 0) {
        liveText.textContent = 'Updating...';
        liveDot.className = 'dot paused';
        countdownSeconds = 10;
        fetchTopology();
      } else {
        liveText.textContent = `Live (update in ${countdownSeconds}s)`;
        liveDot.className = 'dot';
      }
    }, 1000);
  }

  window.addEventListener('DOMContentLoaded', async () => {
    await fetchDeviceTypes();
    fetchTopology();
    startCountdown();
  });

</script>
</body>
</html>
