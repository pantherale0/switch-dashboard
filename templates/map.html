<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<script src="/static/security.js"></script>
<title>{{ title }} - Network Map</title>
<link rel="icon" href="/static/logo.png" type="image/png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0f14; color: #e1e4e8;
    background-image: radial-gradient(circle at 10% 20%, rgba(20, 24, 33, 0.8) 0%, rgba(13, 15, 20, 1) 90.2%);
    background-attachment: fixed;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  
  /* Custom Monospace Scrollbars for High-End Code feel */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: rgba(22, 27, 34, 0.4); border-radius: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(88, 166, 255, 0.2); border-radius: 4px; border: 1px solid rgba(13, 15, 20, 0.5); }
  ::-webkit-scrollbar-thumb:hover { background: rgba(88, 166, 255, 0.4); }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; background: rgba(22, 27, 34, 0.7);
    border-bottom: 1px solid rgba(48, 54, 61, 0.6);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-left img { height: 32px; width: 32px; border-radius: 6px; }
  .header h1 { font-size: 18px; font-weight: 600; color: #f0f6fc; display: flex; align-items: center; gap: 8px; }
  .header .nav-links { display: flex; gap: 12px; align-items: center; }
  .header .nav-links a {
    color: #b1bac4;
    text-decoration: none;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    transition: all .2s;
    background: rgba(33, 38, 45, 0.5);
    border: 1px solid rgba(48, 54, 61, 0.8);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .header .nav-links a:hover {
    color: #ffffff;
    background: #1c2128;
    border-color: #58a6ff;
    box-shadow: 0 0 12px rgba(88, 166, 255, 0.2);
    transform: translateY(-1px);
  }
  .header .nav-links a.active {
    color: #58a6ff;
    border-color: rgba(56, 139, 253, 0.5);
    background: rgba(56, 139, 253, 0.1);
  }

  .main-container {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  .map-canvas-container {
    flex: 1;
    position: relative;
    cursor: grab;
    background: radial-gradient(circle, rgba(22, 27, 34, 0.2) 1px, transparent 1px);
    background-size: 20px 20px;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .map-canvas-container:active { cursor: grabbing; }

  #map-svg {
    width: 100%;
    height: 100%;
    display: block;
    user-select: none;
    touch-action: none;
    -webkit-user-select: none;
  }

  /* Node UI styles */
  .node {
    cursor: pointer;
  }
  .node-bg {
    fill: rgba(13, 17, 23, 0.9);
    stroke-width: 1.5;
    rx: 10; ry: 10;
    transition: stroke 0.3s, filter 0.3s;
  }
  
  /* Color coding by node type */
  .node-internet .node-bg { stroke: #06b6d4; filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.4)); }
  .node-ont .node-bg { stroke: #10b981; filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.45)); }
  .node-router .node-bg { stroke: #a855f7; filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.3)); }
  .node-distribution .node-bg { stroke: #8b5cf6; filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.35)); }
  .node-core .node-bg { stroke: #0284c7; filter: drop-shadow(0 0 6px rgba(2, 132, 199, 0.35)); }
  .node-access .node-bg { stroke: #3b82f6; filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.3)); }
  .node-switch .node-bg { stroke: #3b82f6; filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.3)); }
  .node-access_point .node-bg, .node-ap .node-bg { stroke: #f97316; filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.4)); }
  .node-unmanaged_switch .node-bg { stroke: #0284c7; filter: drop-shadow(0 0 6px rgba(2, 132, 199, 0.3)); }
  .node-repeater .node-bg { stroke: #f97316; filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.3)); }
  .node-client .node-bg { stroke: #10b981; filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.2)); }
  .node-virtualisation_host .node-bg { stroke: #f97316; filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.35)); }
  .node-virtual_machine .node-bg { stroke: #22c55e; filter: drop-shadow(0 0 5px rgba(34, 197, 94, 0.25)); }
  .node-lxc_container .node-bg { stroke: #14b8a6; filter: drop-shadow(0 0 5px rgba(20, 184, 166, 0.25)); }
  .node-phone .node-bg { stroke: #06b6d4; filter: drop-shadow(0 0 7px rgba(6, 182, 212, 0.35)); }
  
  /* Offline states */
  .node-offline .node-bg, .node-stopped .node-bg { stroke: #6b7280 !important; filter: none !important; }
  .node-offline .node-icon-svg, .node-stopped .node-icon-svg { fill: #6b7280 !important; }

  .node:hover .node-bg {
    stroke-width: 2.5;
  }
  .node-internet:hover .node-bg { filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.7)); }
  .node-ont:hover .node-bg { filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.75)); }
  .node-router:hover .node-bg { filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.6)); }
  .node-distribution:hover .node-bg { filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.6)); }
  .node-core:hover .node-bg { filter: drop-shadow(0 0 12px rgba(2, 132, 199, 0.6)); }
  .node-access:hover .node-bg { filter: drop-shadow(0 0 12px rgba(59, 130, 246, 0.6)); }
  .node-switch:hover .node-bg { filter: drop-shadow(0 0 12px rgba(59, 130, 246, 0.6)); }
  .node-access_point:hover .node-bg, .node-ap:hover .node-bg { filter: drop-shadow(0 0 12px rgba(249, 115, 22, 0.7)); }
  .node-repeater:hover .node-bg { filter: drop-shadow(0 0 12px rgba(249, 115, 22, 0.6)); }
  .node-client:hover .node-bg { filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.5)); }
  .node-phone:hover .node-bg { filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.7)); }

  .node-icon-svg {
    fill: #b1bac4;
    transition: fill 0.3s;
  }
  .node-internet .node-icon-svg { fill: #06b6d4; }
  .node-ont .node-icon-svg { fill: #34d399; }
  .node-router .node-icon-svg { fill: #c084fc; }
  .node-distribution .node-icon-svg { fill: #c084fc; }
  .node-core .node-icon-svg { fill: #38bdf8; }
  .node-access .node-icon-svg { fill: #60a5fa; }
  .node-switch .node-icon-svg { fill: #60a5fa; }
  .node-access_point .node-icon-svg, .node-ap .node-icon-svg { fill: #fb923c; }
  .node-unmanaged_switch .node-icon-svg { fill: #38bdf8; }
  .node-repeater .node-icon-svg { fill: #ff9d5c; }
  .node-client .node-icon-svg { fill: #34d399; }
  .node-phone .node-icon-svg { fill: #22d3ee; }
  .node-virtualisation_host .node-icon-svg { fill: #fb923c; }
  .node-virtual_machine .node-icon-svg { fill: #4ade80; }
  .node-lxc_container .node-icon-svg { fill: #2dd4bf; }

  .node-label {
    font-size: 11px;
    font-weight: 600;
    fill: #f0f6fc;
    text-anchor: middle;
    pointer-events: none;
  }
  .node-sublabel {
    font-size: 9px;
    fill: #8b949e;
    text-anchor: middle;
    pointer-events: none;
    font-family: 'SF Mono', Monaco, monospace;
  }

  /* Status light indicator on nodes */
  .node-status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .node-status-dot.online { fill: #3fb950; }
  .node-status-dot.offline { fill: #f85149; }

  /* Links and connections */
  .link-bg {
    fill: none;
    stroke: transparent;
    stroke-width: 8px;
    cursor: pointer;
  }
  .link-line {
    fill: none;
    stroke: #484f58; /* Default fallback slate gray */
    stroke-width: 2.5;
    transition: stroke 0.3s, stroke-width 0.3s;
  }
  .link-type-client .link-line {
    stroke: #4b5563; /* Subtle slate gray for clients */
    stroke-width: 1.5;
    stroke-dasharray: 4, 4; /* Dashed lines for client connections */
  }
  .link-type-virtual_child .link-line {
    stroke: #64748b;
    stroke-width: 1.5;
    stroke-dasharray: 3, 5;
  }
  .link-type-physical_host .link-line {
    stroke: #f97316;
  }
  .link-marching {
    fill: none;
    stroke-width: 1.5;
    stroke-dasharray: 6, 8;
    animation: march 25s linear infinite;
    pointer-events: none;
    opacity: 0.8;
  }
  
  @keyframes march {
    to { stroke-dashoffset: -1000; }
  }

  /* Link speeds color coding */
  .link-10g .link-line { stroke: #1f6feb; }
  .link-10g .link-marching { stroke: #58a6ff; }
  
  .link-2_5g .link-line, .link-2\.5g .link-line, .link-2500m .link-line { stroke: #58a6ff; }
  .link-2_5g .link-marching, .link-2\.5g .link-marching, .link-2500m .link-marching { stroke: #8b949e; }
  
  .link-1g .link-line, .link-1000m .link-line { stroke: #3fb950; }
  .link-1g .link-marching, .link-1000m .link-marching { stroke: #56d364; }
  
  .link-100m .link-line, .link-10m .link-line { stroke: #f08a24; }
  .link-100m .link-marching, .link-10m .link-marching { stroke: #f1aa5a; }


  .link-down .link-line, .link-unknown .link-line { stroke: #484f58; stroke-dasharray: 4, 4; }
  .link-down .link-marching, .link-unknown .link-marching { display: none; }

  .link-group:hover .link-line {
    stroke-width: 4.5;
  }

  .port-badge {
    fill: #161b22;
    stroke: #30363d;
    stroke-width: 1;
    rx: 4; ry: 4;
  }
  .port-badge-text {
    font-size: 8px;
    fill: #8b949e;
    font-family: 'SF Mono', Monaco, monospace;
    text-anchor: middle;
    alignment-baseline: middle;
  }

  /* Dynamic Link Saturation Heat */
  .link-saturated .link-line { stroke: #ef4444 !important; stroke-width: 3.5px !important; filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.7)); }
  .link-saturated .link-marching { stroke: #fca5a5 !important; stroke-width: 2px !important; }
  .link-moderate .link-line { stroke: #f59e0b !important; filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.5)); }
  .link-moderate .link-marching { stroke: #fde68a !important; }

  /* Semantic Port Role Badges */
  .port-role-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .role-uplink { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
  .role-downlink { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
  .role-inter_switch { background: rgba(139, 92, 246, 0.2); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.4); }
  .role-ap_trunk { background: rgba(249, 115, 22, 0.2); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.4); }
  .role-access { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
  .role-unmanaged { background: rgba(6, 182, 212, 0.2); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.4); }
  .role-unused { background: rgba(107, 114, 128, 0.2); color: #9ca3af; border: 1px solid rgba(107, 114, 128, 0.4); }

  /* ==========================================
     PATH HIGHLIGHTING & ACTIVE CONDUIT STYLES
     ========================================== */
  .path-highlight-active #nodes-group .node {
    opacity: 0.18;
    transition: opacity 0.3s ease, filter 0.3s ease;
  }
  .path-highlight-active #nodes-group .node.in-path {
    opacity: 1 !important;
    filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.7));
  }
  .path-highlight-active #nodes-group .node.path-origin {
    opacity: 1 !important;
    filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.95)) !important;
  }
  .path-highlight-active #nodes-group .node.path-origin .node-bg {
    stroke: #38bdf8 !important;
    stroke-width: 2.5px !important;
  }
  .path-highlight-active #nodes-group .node.path-destination {
    opacity: 1 !important;
    filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.95)) !important;
  }
  .path-highlight-active #nodes-group .node.path-destination .node-bg {
    stroke: #10b981 !important;
    stroke-width: 2.5px !important;
  }
  .path-highlight-active #links-group .link-group {
    opacity: 0.08;
    transition: opacity 0.3s ease;
  }
  .path-highlight-active #links-group .link-group.in-path {
    opacity: 1 !important;
  }
  .path-highlight-active #links-group .link-group.in-path .link-line {
    stroke: #38bdf8 !important;
    stroke-width: 4px !important;
    stroke-dasharray: none !important;
    filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.85));
    transition: stroke 0.3s, stroke-width 0.3s;
  }
  .path-highlight-active #links-group .link-group.in-path .link-marching {
    display: block !important;
    stroke: #ffffff !important;
    stroke-width: 2.5px !important;
    opacity: 1 !important;
    animation: march 2.5s linear infinite !important;
    filter: drop-shadow(0 0 4px #38bdf8);
  }

  /* Floating Path Highlighting HUD */
  .path-hud {
    position: absolute;
    top: 68px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    background: rgba(13, 17, 23, 0.92);
    border: 1px solid #38bdf8;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 16px rgba(56, 189, 248, 0.25);
    border-radius: 30px;
    padding: 6px 14px 6px 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .path-hud-content {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: #f0f6fc;
  }
  .path-hud-icon {
    font-size: 14px;
    color: #38bdf8;
    filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.8));
  }
  .path-hud-title {
    font-weight: 700;
    color: #38bdf8;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.5px;
  }
  .path-hud-route {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #c9d1d9;
    font-weight: 500;
    max-width: 650px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .path-hud-route .hop-node {
    color: #f0f6fc;
    font-weight: 600;
  }
  .path-hud-route .hop-arrow {
    color: #38bdf8;
    margin: 0 5px;
    font-weight: bold;
  }
  .path-hud-route .hop-port {
    font-size: 10px;
    color: #8b949e;
    font-family: 'SF Mono', Monaco, monospace;
    margin-left: 2px;
  }
  .path-hud-close {
    background: rgba(48, 54, 61, 0.6);
    border: none;
    color: #8b949e;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    margin-left: 4px;
  }
  .path-hud-close:hover {
    background: #da3637;
    color: white;
  }

  /* Sidebar Route Stepper */
  .route-stepper {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-top: 10px;
    padding-left: 6px;
  }
  .route-step {
    display: flex;
    align-items: flex-start;
    position: relative;
    padding-bottom: 14px;
  }
  .route-step:last-child {
    padding-bottom: 0;
  }
  .route-step-indicator {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-right: 12px;
    position: relative;
  }
  .route-step-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #38bdf8;
    border: 2px solid #0d1117;
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
    z-index: 2;
    flex-shrink: 0;
  }
  .route-step.step-origin .route-step-dot {
    background: #38bdf8;
    box-shadow: 0 0 10px rgba(56, 189, 248, 1);
  }
  .route-step.step-dest .route-step-dot {
    background: #10b981;
    box-shadow: 0 0 10px rgba(16, 185, 129, 1);
  }
  .route-step.step-hop .route-step-dot {
    background: #8b949e;
    width: 10px;
    height: 10px;
  }
  .route-step-line {
    position: absolute;
    top: 12px;
    bottom: -2px;
    width: 2px;
    background: linear-gradient(180deg, rgba(56, 189, 248, 0.8), rgba(56, 189, 248, 0.3));
    z-index: 1;
  }
  .route-step:last-child .route-step-line {
    display: none;
  }
  .route-step-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .route-step-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .route-step-name {
    font-size: 12px;
    font-weight: 600;
    color: #f0f6fc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .route-step-name:hover {
    color: #38bdf8;
    text-decoration: underline;
  }
  .route-step-sub {
    font-size: 11px;
    color: #8b949e;
    margin-top: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .route-hop-badge {
    display: inline-block;
    font-size: 10px;
    font-family: 'SF Mono', Monaco, monospace;
    background: rgba(56, 189, 248, 0.15);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.3);
    padding: 1px 5px;
    border-radius: 4px;
    margin-top: 4px;
  }

  /* UniFi Style Top Floating Toolbar */
  .top-toolbar {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(22, 27, 34, 0.88);
    border: 1px solid rgba(48, 54, 61, 0.8);
    border-radius: 10px;
    padding: 6px 10px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    z-index: 25;
  }
  .toolbar-pill-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .toolbar-btn {
    background: transparent;
    border: 1px solid transparent;
    color: #8b949e;
    font-size: 11px;
    font-weight: 500;
    padding: 5px 11px;
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .toolbar-btn:hover {
    color: #f0f6fc;
    background: rgba(56, 139, 253, 0.12);
    border-color: rgba(56, 139, 253, 0.35);
  }
  .toolbar-btn.active {
    color: #58a6ff;
    background: rgba(56, 139, 253, 0.18);
    border-color: #388bfd;
    font-weight: 600;
    box-shadow: 0 0 10px rgba(56, 139, 253, 0.2);
  }
  .toolbar-divider {
    width: 1px;
    height: 18px;
    background: rgba(48, 54, 61, 0.8);
    margin: 0 2px;
  }

  /* Compact UniFi Client Pills */
  .node-client .node-bg {
    fill: rgba(18, 24, 32, 0.94) !important;
    stroke: rgba(56, 139, 253, 0.28) !important;
    stroke-width: 1px !important;
    rx: 14 !important; ry: 14 !important;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
    transition: all 0.2s ease;
  }
  .node-client:hover .node-bg {
    fill: rgba(26, 34, 46, 0.98) !important;
    stroke: #58a6ff !important;
    stroke-width: 1.5px !important;
    filter: drop-shadow(0 0 10px rgba(88, 166, 255, 0.5)) !important;
  }
  .client-pill-label {
    font-size: 10.5px;
    font-weight: 500;
    fill: #e6edf3;
    pointer-events: none;
    text-anchor: start;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* Per-Switch Collapsible Client Toggle Badge */
  .client-toggle-badge {
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .client-toggle-badge:hover {
    transform: scale(1.05);
    filter: brightness(1.2);
  }
  .client-toggle-bg {

  /* Sleek Client Connecting Links */

  /* Floating UI Panels */
  .sidebar {

    border-left: 1px solid rgba(48, 54, 61, 0.6);

  .panel-header {

  .close-sidebar-btn {

  .search-box {

  .control-card {

    border: 1px solid rgba(48, 54, 61, 0.4);

  .control-card h3 { font-size: 11px; text-transform: uppercase; color: #8b949e; letter-spacing: 0.5px; margin-bottom: 10px; font-weight: 600; }
  .control-row {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px;
  }
  .control-row:last-child { margin-bottom: 0; }
  
  /* Toggle Switches */
  .switch-toggle {

  }

  .slider {

  .slider:before {
    position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px;

  }
  input:checked + .slider { background-color: rgba(56, 139, 253, 0.15); border-color: #388bfd; }
  input:checked + .slider:before { transform: translateX(14px); background-color: #58a6ff; }

  /* Device details styles */
  .detail-avatar-container {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid rgba(48, 54, 61, 0.4);
    padding-bottom: 14px;
    margin-bottom: 4px;
  }
  .detail-avatar {
    width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center;

  .detail-title h3 { font-size: 14px; font-weight: 600; color: #f0f6fc; }

  .detail-item {

  .empty-state {
    text-align: center; color: #8b949e; padding: 40px 20px; font-size: 12px;

  /* Map controls floating buttons */
  .map-controls {

  /* Pulse highlights on search find */
  @keyframes highlight-pulse {
    0% { r: 28px; opacity: 1; stroke-width: 1px; }

  .highlight-ring {

  /* Floating search suggestions popup */
  .search-suggestions {
    position: absolute;

  .legend-bar {

  .header .status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: #b1bac4;
    margin-right: 12px;
  }
  .header .status .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;

  }
  .header .status .dot.paused {
    background: #d29922;
  }
  .header .status .dot.error {
    background: #f85149;
  }

  /* Mobile & Touch Screen Responsive Styles */
  .sidebar-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);

    }

    }

  @media (max-width: 768px) {
    .header {
      padding: 10px 14px;
    }
    .header h1 {
      font-size: 16px;
    }
    .header .nav-links {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      gap: 6px;

      height: 42px;

    }

</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="/static/logo.png" alt="Horaco Logo" style="height: 38px; width: 38px; border-radius: 8px; object-fit: cover; border: 1px solid #30363d; box-shadow: 0 0 10px rgba(88, 166, 255, 0.15);">
    <h1 style="font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.5px; background: linear-gradient(135deg, #ffffff 30%, #a5c2f4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Network Map</h1>
  </div>
  <div class="nav-links">
    <span class="status">
      <span class="dot" id="live-dot"></span>

    </span>

    <a href="/scanner">🌐 Scanner</a>
    <a href="/config">&#9881; Config</a>
    <a href="/backups">💾 Backups</a>
    <a href="/logs">📋 Logs</a>
  </div>
</div>

<div class="main-container">
  
  <!-- Left Side Floating Map Legends -->
  <div class="legend-bar">
    <div class="legend-item"><span class="legend-color" style="background: #1f6feb;"></span> 10G</div>
    <div class="legend-item"><span class="legend-color" style="background: #58a6ff;"></span> 2.5G</div>
    <div class="legend-item"><span class="legend-color" style="background: #3fb950;"></span> 1G</div>
    <div class="legend-item"><span class="legend-color" style="background: #f08a24;"></span> 100M</div>
  </div>

  <!-- UniFi Top Floating Toolbar -->
  <div class="top-toolbar">
    <div class="toolbar-pill-group">
      <button class="toolbar-btn active" id="btn-mode-tree" onclick="setViewMode('tree')" title="Show backbone and side wings">
        <svg viewBox="0 0 24 24" width="13" height="13"><path fill="currentColor" d="M22 11V3h-7v3H9V3H2v8h7V8h2v10h4v3h7v-8h-7v3h-2V8h2v3h7zM4 5h3v4H4V5zm13 0h3v4h-3V5zm0 10h3v4h-3v-4z"/></svg>
        <span>Topology Tree</span>
      </button>
      <button class="toolbar-btn" id="btn-mode-infra" onclick="setViewMode('infra')" title="Show infrastructure backbone only">
        <svg viewBox="0 0 24 24" width="13" height="13"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2v-4H6v-2h4V7h2v4h4v2h-4v4z"/></svg>
        <span>Infrastructure</span>
      </button>
    </div>
    
    <div class="toolbar-divider"></div>
    
    <div class="toolbar-pill-group">
      <button class="toolbar-btn" onclick="expandAllClients()" title="Expand all client wings">
        <span>▾ Expand All</span>
      </button>
      <button class="toolbar-btn" onclick="collapseAllClients()" title="Collapse all client wings">
        <span>▸ Collapse All</span>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-pill-group">
      <button class="toolbar-btn" onclick="autoAlignLayout()" title="Auto-align network nodes in UniFi tree format">
        <svg viewBox="0 0 24 24" width="13" height="13"><path fill="currentColor" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        <span>Auto Align</span>
      </button>
      <button class="toolbar-btn" onclick="resetZoom()" title="Center view">
        <svg viewBox="0 0 24 24" width="13" height="13"><path fill="currentColor" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
        <span>Center</span>
      </button>
    </div>
  </div>

  <!-- Floating Path Highlighting HUD -->
  <div id="path-highlight-hud" class="path-hud" style="display: none;">
    <div class="path-hud-content">
      <span class="path-hud-icon">⚡</span>
      <span class="path-hud-title" id="path-hud-title">Active Route</span>
      <span class="path-hud-route" id="path-hud-route"></span>
      <button type="button" class="path-hud-close" onclick="clearPathHighlight()" title="Clear path highlight (Esc)">✕</button>
    </div>
  </div>

  <!-- Zoom & Center Controls -->
  <div class="map-controls">
    <button class="map-btn" onclick="zoom(1.2)" title="Zoom In">+</button>
    <button class="map-btn" onclick="zoom(0.8)" title="Zoom Out">-</button>
    <button class="map-btn" onclick="resetZoom()" title="Recenter Map">&#8982;</button>
  </div>

  <!-- Canvas Container -->
  <div class="map-canvas-container" id="canvas-container">
    <svg id="map-svg">
      <defs>
        <!-- Grids or gradients if needed -->
      </defs>
      <!-- Viewport group that is zoomed/panned -->
      <g id="viewport" transform="translate(0,0) scale(1)">
        <g id="links-group"></g>
        <g id="nodes-group"></g>

  <!-- Mobile Sidebar Backdrop Overlay -->
  <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="toggleSidebar(false)"></div>

  <!-- Device Details Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="panel-header">
      <h2>Device Inspector</h2>
      <button class="close-sidebar-btn" onclick="toggleSidebar(false)">&times;</button>
    </div>
    <div class="panel-content">
      
      <!-- Interactive Search -->
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="search-input" placeholder="Search MAC, vendor, IP or name..." oninput="handleSearchInput(this.value)">

            <span class="slider"></span>
          </label>

          <span>Active Marching Lines</span>
          <label class="switch-toggle">
            <input type="checkbox" id="toggle-marching" checked onchange="handleMarchingToggle()">
            <span class="slider"></span>
          </label>
        </div>
        <div class="control-row" style="margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(48, 54, 61, 0.4);">
          <button type="button" class="map-btn" onclick="resetLayout()" style="width: 100%; height: auto; padding: 8px 12px; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600;">
            🔄 Reset Layout
          </button>

      <!-- Detail Card (Dynamically Rendered) -->
      <div class="control-card" id="detail-card">
        <div class="empty-state">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          <p>Select a node on the map to inspect properties and active links.</p>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- Hover tooltip for links -->
<div class="link-tooltip" id="link-tooltip"></div>

<script>
  let rawNodes = [];
  let rawLinks = [];
  
  // Layout representation
  let nodes = {};
  let links = [];
  
  let showClients = true;
  let showMarching = true;
  let clientCountMap = {};
  let collapsedSwitches = new Set();
  let viewMode = 'tree';

  function setViewMode(mode) {
    viewMode = mode;
    const btnTree = document.getElementById('btn-mode-tree');
    const btnInfra = document.getElementById('btn-mode-infra');
    if (btnTree) btnTree.classList.toggle('active', mode === 'tree');
    if (btnInfra) btnInfra.classList.toggle('active', mode === 'infra');
    if (mode === 'infra') {
      showClients = false;
    } else {
      showClients = true;
    }
    const toggleEl = document.getElementById('toggle-clients');
    if (toggleEl) toggleEl.checked = showClients;
    processAndRender();
  }

  function toggleSwitchClients(switchId) {
    if (collapsedSwitches.has(switchId)) {
      collapsedSwitches.delete(switchId);
    } else {
      collapsedSwitches.add(switchId);
    }
    if (!showClients) {
      showClients = true;
      viewMode = 'tree';
      const btnTree = document.getElementById('btn-mode-tree');
      const btnInfra = document.getElementById('btn-mode-infra');
      if (btnTree) btnTree.classList.add('active');
      if (btnInfra) btnInfra.classList.remove('active');
      const toggleEl = document.getElementById('toggle-clients');
      if (toggleEl) toggleEl.checked = true;
    }
    processAndRender();
  }

  function expandAllClients() {
    collapsedSwitches.clear();
    showClients = true;
    viewMode = 'tree';
    const btnTree = document.getElementById('btn-mode-tree');
    const btnInfra = document.getElementById('btn-mode-infra');
    if (btnTree) btnTree.classList.add('active');
    if (btnInfra) btnInfra.classList.remove('active');
    const toggleEl = document.getElementById('toggle-clients');
    if (toggleEl) toggleEl.checked = true;
    processAndRender();
  }

  function collapseAllClients() {
    rawNodes.forEach(n => {
      if (n.type !== 'client') collapsedSwitches.add(n.id);
    });
    processAndRender();
  }

  async function autoAlignLayout() {
    for (let key in positionCache) {
      delete positionCache[key];
    }
    try {
      await fetch('/api/config/settings', {
        method: 'POST',

  function computeLayout(filteredNodes, filteredLinks) {
    const isVirtualGuest = node => ['virtual_machine', 'lxc_container'].includes(node.type);

    // 1. Separate infrastructure nodes and wing nodes
    const infraNodes = filteredNodes.filter(n => !isWingNode(n));
    const wingNodes = filteredNodes.filter(n => isWingNode(n));
    const infraNodesMap = {};
    infraNodes.forEach(n => { infraNodesMap[n.id] = n; });

    // 2. Build undirected adjacency for infrastructure

    infraNodes.forEach(n => { infraAdj[n.id] = []; });
    filteredLinks.filter(l => !['client', 'virtual_child'].includes(l.type)).forEach(l => {
      if (infraAdj[l.source] && infraAdj[l.target] && l.source !== l.target) {
        if (!infraAdj[l.source].includes(l.target)) infraAdj[l.source].push(l.target);

        }
      }
      if (parentId) {

        if (!clientsByParent[parentId]) clientsByParent[parentId] = [];
        clientsByParent[parentId].push(client);
      }
    });

    // 4. Find primary root (Internet > Router > Switch > first)
    let primaryRoot = null;
    const internetNode = infraNodes.find(n => n.type === 'internet');
    if (internetNode) {
      primaryRoot = internetNode.id;
    } else {
      const routerNode = infraNodes.find(n => n.type === 'router' || n.role === 'router');
      if (routerNode) {
        primaryRoot = routerNode.id;
      } else {
        const switchNode = infraNodes.find(n => n.type === 'switch');
        primaryRoot = switchNode ? switchNode.id : (infraNodes[0] ? infraNodes[0].id : null);
      }
    }

    // Role priority for ordering sibling branches (switches/routers central, APs/hosts fanning out)
    function getRolePriority(node) {
      if (!node) return 99;
      const type = node.type || node.role || '';
      if (type === 'internet') return 0;
      if (type === 'ont') return 1;
      if (type === 'router') return 2;
      if (type === 'distribution') return 3;
      if (type === 'core') return 4;
      if (type === 'switch') return 5;
      if (type === 'access') return 6;
      if (type === 'access_point' || type === 'ap') return 7;
      if (type === 'virtualisation_host') return 8;
      if (type === 'unmanaged_switch') return 9;
      if (type === 'phone') return 10;
      return 20;
    }

    // 5. Build directed spanning forest and compute levels (depths)
    const visited = new Set();
    const treeChildren = {};
    const treeParent = {};
    treeParentMap = {};
    const levels = {};
    const roots = [];

    infraNodes.forEach(n => { treeChildren[n.id] = []; });

    function traverseTree(startId, startLvl) {
      roots.push(startId);
      visited.add(startId);
      const queue = [{ id: startId, level: startLvl }];
      while (queue.length > 0) {
        const curr = queue.shift();
        levels[curr.id] = curr.level;
        const nbrs = infraAdj[curr.id] || [];
        // Sort neighbors so switches/backbone stay on the left/center, APs & hosts fan outward
        nbrs.sort((a, b) => {
          const nA = infraNodesMap[a];
          const nB = infraNodesMap[b];
          const prioDiff = getRolePriority(nA) - getRolePriority(nB);
          if (prioDiff !== 0) return prioDiff;
          return (nA?.name || '').localeCompare(nB?.name || '');
        });
        nbrs.forEach(nbr => {
          if (!visited.has(nbr)) {
            visited.add(nbr);
            treeChildren[curr.id].push(nbr);
            treeParent[nbr] = curr.id;
            treeParentMap[nbr] = curr.id;
            queue.push({ id: nbr, level: curr.level + 1 });
          }
        });
      }
    }

    if (primaryRoot) {
      traverseTree(primaryRoot, 0);
    }

    // Catch any disconnected infrastructure components (multi-site or unlinked devices)
    infraNodes.forEach(n => {
      if (!visited.has(n.id)) {
        const startLvl = (primaryRoot && infraNodesMap[primaryRoot]?.type === 'internet') ? 1 : 0;
        traverseTree(n.id, startLvl);
      }
    });

    // 5b. Subtree weighting & balanced backbone centering
    const subtreeWeight = {};
    function computeSubtreeWeights(nodeId) {
      const ch = treeChildren[nodeId] || [];
      let totalDescendants = 0;
      let maxDepth = 0;
      ch.forEach(c => {
        computeSubtreeWeights(c);
        const w = subtreeWeight[c] || { descendants: 0, depth: 0 };
        totalDescendants += 1 + w.descendants;
        if (1 + w.depth > maxDepth) maxDepth = 1 + w.depth;
      });
      const score = totalDescendants * 10 + maxDepth * 5;
      subtreeWeight[nodeId] = { descendants: totalDescendants, depth: maxDepth, score: score };
    }
    roots.forEach(r => computeSubtreeWeights(r));

    function arrangeChildrenBalanced(children) {
      if (!children || children.length <= 1) return children;
      // Sort children by subtree score descending (heaviest backbone trunk first)
      const sorted = [...children].sort((a, b) => {
        const sA = subtreeWeight[a]?.score || 0;
        const sB = subtreeWeight[b]?.score || 0;
        if (sB !== sA) return sB - sA;
        const prioDiff = getRolePriority(infraNodesMap[a]) - getRolePriority(infraNodesMap[b]);
        if (prioDiff !== 0) return prioDiff;
        return (infraNodesMap[a]?.name || '').localeCompare(infraNodesMap[b]?.name || '');
      });

      // Place heaviest backbone trunk in the center, then alternate remaining leaves to flanks
      const result = [];
      sorted.forEach((childId, idx) => {
        if (idx === 0) {
          result.push(childId);
        } else if (idx % 2 === 1) {
          result.push(childId); // right flank
        } else {
          result.unshift(childId); // left flank
        }
      });
      return result;
    }

    infraNodes.forEach(n => {
      treeChildren[n.id] = arrangeChildrenBalanced(treeChildren[n.id]);
    });

    // 6. Geometry Constants (Optimized to eliminate dead space)
    const itemsPerCol = 10;
    const colSpacing = 144;
    const rowSpacing = 32;
    const clientOffsetX = 175;
    const SIBLING_GAP = 36;
    const COMPONENT_GAP = 60;
    const verticalGap = 42;

    // Calculate node horizontal & vertical footprint including client wings
    const nodeSelf = {};
    infraNodes.forEach(n => {
      const clients = clientsByParent[n.id] || [];
      if (clients.length === 0 || collapsedSwitches.has(n.id)) {
        nodeSelf[n.id] = { left: 95, right: 95, above: 30, below: 30 };
      } else {
        const nl = Math.ceil(clients.length / 2);
        const nr = Math.floor(clients.length / 2);
        const colsL = Math.ceil(nl / itemsPerCol);
        const colsR = Math.ceil(nr / itemsPerCol);
        const wL = colsL > 0 ? (clientOffsetX + (colsL - 1) * colSpacing + 69 + 10) : 95;
        const wR = colsR > 0 ? (clientOffsetX + (colsR - 1) * colSpacing + 69 + 10) : 95;
        const rows = Math.min(itemsPerCol, Math.max(nl, nr));
        const wingHalfHeight = Math.max(30, ((rows - 1) * rowSpacing + 28) / 2 + 10);
        nodeSelf[n.id] = { left: wL, right: wR, above: wingHalfHeight, below: wingHalfHeight };
      }
    });

    // 7. Dynamic Level Y coordinates (prevents vertical overlap between tiers)
    const byLevel = {};
    infraNodes.forEach(n => {
      const lvl = levels[n.id] ?? 0;
      if (!byLevel[lvl]) byLevel[lvl] = [];
      byLevel[lvl].push(n.id);
    });

    const sortedLevels = Object.keys(byLevel).map(Number).sort((a, b) => a - b);
    const levelYMap = {};
    let curY = 80;

    for (let i = 0; i < sortedLevels.length; i++) {
      const lvl = sortedLevels[i];
      const nodesAtLvl = byLevel[lvl];
      const maxAbove = Math.max(...nodesAtLvl.map(id => nodeSelf[id]?.above || 30));
      const maxBelow = Math.max(...nodesAtLvl.map(id => nodeSelf[id]?.below || 30));
      if (i === 0) {
        curY = 80 + maxAbove;
      } else {
        const prevLvl = sortedLevels[i - 1];
        const prevBelow = Math.max(...byLevel[prevLvl].map(id => nodeSelf[id]?.below || 30));
        curY += prevBelow + verticalGap + maxAbove;
      }
      levelYMap[lvl] = curY;
    }

    // 8. Bottom-Up Subtree Width & Contour Calculation
    const subtreeOffsets = {};

    function getSubtreeContour(u) {
      const children = treeChildren[u] || [];
      if (children.length === 0) {
        return {
          left: [-nodeSelf[u].left],
          right: [nodeSelf[u].right],
        };
      }

      const childContours = children.map(c => getSubtreeContour(c));
      const childRelX = [0];

      for (let i = 1; i < children.length; i++) {
        const prevC = childContours[i - 1];
        const currC = childContours[i];
        const minSpacing = nodeSelf[children[i - 1]].right + SIBLING_GAP + nodeSelf[children[i]].left;
        let overlapShift = 0;
        const maxCheckDepth = Math.min(prevC.right.length, currC.left.length);
        for (let d = 0; d < maxCheckDepth; d++) {
          const depthShift = prevC.right[d] - currC.left[d] + SIBLING_GAP;
          if (depthShift > overlapShift) overlapShift = depthShift;
        }
        const shift = Math.max(minSpacing, overlapShift);
        childRelX.push(childRelX[i - 1] + shift);
      }

      let midX;
      const scores = children.map(c => subtreeWeight[c]?.score || 0);
      const maxScore = Math.max(...scores);
      const trunkIdx = scores.indexOf(maxScore);
      const otherScores = scores.filter((_, idx) => idx !== trunkIdx);
      const secondMax = otherScores.length > 0 ? Math.max(...otherScores) : 0;
      if (maxScore > 0 && maxScore >= secondMax * 2 && children.length > 1) {
        midX = childRelX[trunkIdx];
      } else {
        midX = (childRelX[0] + childRelX[children.length - 1]) / 2;
      }
      const offsets = childRelX.map(x => x - midX);
      subtreeOffsets[u] = offsets;

      // Merge contours
      const combLeft = [-nodeSelf[u].left];
      const combRight = [nodeSelf[u].right];

      let maxChildDepth = 0;
      childContours.forEach(c => {
        if (c.left.length > maxChildDepth) maxChildDepth = c.left.length;
      });

      for (let d = 0; d < maxChildDepth; d++) {
        let dLeft = 0;
        let dRight = 0;
        let first = true;
        for (let i = 0; i < children.length; i++) {
          if (d < childContours[i].left.length) {
            const curL = offsets[i] + childContours[i].left[d];
            const curR = offsets[i] + childContours[i].right[d];
            if (first || curL < dLeft) dLeft = curL;
            if (first || curR > dRight) dRight = curR;
            first = false;
          }
        }
        combLeft.push(dLeft);
        combRight.push(dRight);
      }

      return { left: combLeft, right: combRight };
    }

    // 9. Position Forest Roots Side-by-Side
    const rootContours = roots.map(r => getSubtreeContour(r));
    const rootRelX = [0];

    for (let j = 1; j < roots.length; j++) {
      const prevC = rootContours[j - 1];
      const currC = rootContours[j];
      const minSpacing = nodeSelf[roots[j - 1]].right + COMPONENT_GAP + nodeSelf[roots[j]].left;
      let overlapShift = 0;
      const maxCheckDepth = Math.min(prevC.right.length, currC.left.length);
      for (let d = 0; d < maxCheckDepth; d++) {
        const depthShift = prevC.right[d] - currC.left[d] + COMPONENT_GAP;
        if (depthShift > overlapShift) overlapShift = depthShift;
      }
      const shift = Math.max(minSpacing, overlapShift);
      rootRelX.push(rootRelX[j - 1] + shift);
    }

    // Center roots in viewport
    const containerWidth = canvasContainer ? canvasContainer.clientWidth : 1200;
    const spineX = Math.max(containerWidth / 2, 700);
    const totalRootSpan = rootRelX[roots.length - 1] - rootRelX[0];
    const startX = spineX - totalRootSpan / 2;
    const rootX = rootRelX.map(rx => startX + rx);

    // 10. Top-Down Coordinate Assignment for Infrastructure Nodes
    function assignCoords(u, currentX) {
      const node = infraNodesMap[u];
      if (!node) return;

      if (node.type !== 'virtualisation_host' && positionCache[node.id]) {
        node.x = positionCache[node.id].x;
        node.y = positionCache[node.id].y;
      } else {
        node.x = currentX;
        node.y = levelYMap[levels[u]] || 100;
      }

      const children = treeChildren[u] || [];
      const offsets = subtreeOffsets[u] || [];
      children.forEach((childId, idx) => {
        assignCoords(childId, currentX + (offsets[idx] || 0));
      });
    }

    roots.forEach((rootId, idx) => {
      assignCoords(rootId, rootX[idx]);
    });

    // Ensure all infra nodes have coordinates
    infraNodes.forEach((node, idx) => {
      if (node.x === undefined || isNaN(node.x)) {
        node.x = 200 + (idx % 4) * 250;
        node.y = 100 + Math.floor(idx / 4) * 160;
      }
    });

    // 11. Layout Client & Virtual Guest Wings around their parent
    Object.keys(clientsByParent).forEach(parentId => {
      const parentNode = infraNodesMap[parentId];
      if (!parentNode) return;

      const clients = clientsByParent[parentId];
      clients.sort((a, b) => {
        const pA = String(a.parent_port || a.last_seen_port || '');
        const pB = String(b.parent_port || b.last_seen_port || '');
        if (pA !== pB) return pA.localeCompare(pB, undefined, { numeric: true });
        return (a.name || a.host || '').localeCompare(b.name || b.host || '');
      });

      const px = parentNode.x;
      const py = parentNode.y;

      const leftClients = [];
      const rightClients = [];

      clients.forEach((c, idx) => {
        if (idx % 2 === 0) leftClients.push(c);
        else rightClients.push(c);
      });

      const leftRows = Math.min(itemsPerCol, leftClients.length);
      const rightRows = Math.min(itemsPerCol, rightClients.length);

      leftClients.forEach((client, i) => {
        if (!isVirtualGuest(client) && positionCache[client.id]) {
          client.x = positionCache[client.id].x;
          client.y = positionCache[client.id].y;
        } else {
          const col = Math.floor(i / itemsPerCol);
          const row = i % itemsPerCol;
          client.x = px - clientOffsetX - col * colSpacing;
          client.y = py + (row - (leftRows - 1) / 2) * rowSpacing;
        }
      });

      rightClients.forEach((client, i) => {
        if (!isVirtualGuest(client) && positionCache[client.id]) {
          client.x = positionCache[client.id].x;
          client.y = positionCache[client.id].y;
        } else {
          const col = Math.floor(i / itemsPerCol);
          const row = i % itemsPerCol;
          client.x = px + clientOffsetX + col * colSpacing;
          client.y = py + (row - (rightRows - 1) / 2) * rowSpacing;
        }
      });
    });

    // 12. Compute overall map bounding box
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    filteredNodes.forEach(n => {
      const hw = isWingNode(n) ? 75 : (nodeSelf[n.id]?.left || 90);
      const hh = isWingNode(n) ? 16 : (nodeSelf[n.id]?.above || 35);
      if (n.x - hw < minX) minX = n.x - hw;
      if (n.x + hw > maxX) maxX = n.x + hw;
      if (n.y - hh < minY) minY = n.y - hh;
      if (n.y + hh > maxY) maxY = n.y + hh;
    });

    // If map protrudes past x = 80 on the left, shift all nodes rightward so nothing is cut off
    if (minX < 80) {
      const shiftX = 80 - minX;
      filteredNodes.forEach(n => {
        if (!positionCache[n.id]) {
          n.x += shiftX;
        }
      });
      maxX += shiftX;
      minX = 80;
    }

    mapBounds = {
      minX: Math.floor(minX),
      maxX: Math.ceil(maxX),
      minY: Math.floor(minY),
      maxY: Math.ceil(maxY)
    };

    // Assemble nodes map
    nodes = {};
    filteredNodes.forEach(node => {
      nodes[node.id] = node;
    });
  }

  // Draw links and nodes
  function processAndRender() {
    const isWingNodeType = type => type === 'client' || type === 'virtual_machine' || type === 'lxc_container';
    const isWingLinkType = type => type === 'client' || type === 'virtual_child';

    // 1. Build client count map for all switches/routers
    clientCountMap = {};
    rawLinks.forEach(link => {
      if (link.type === 'client') {
        clientCountMap[link.source] = (clientCountMap[link.source] || 0) + 1;
      }
    });

    // 2. Filter elements based on client toggle and per-switch collapsed state
    let filteredNodes = rawNodes;
    let filteredLinks = rawLinks;
    
    if (!showClients) {
      filteredNodes = rawNodes.filter(n => !isWingNodeType(n.type));
      filteredLinks = rawLinks.filter(l => !isWingLinkType(l.type));
    } else if (collapsedSwitches.size > 0) {
      const hiddenWingNodeIds = new Set();
      rawLinks.forEach(l => {
        if (isWingLinkType(l.type) && collapsedSwitches.has(l.source)) {
          hiddenWingNodeIds.add(l.target);
        }
      });
      filteredNodes = rawNodes.filter(n => !hiddenWingNodeIds.has(n.id));
      filteredLinks = rawLinks.filter(l => !hiddenWingNodeIds.has(l.target));
    }

    // Compute node coordinates
    computeLayout(filteredNodes, filteredLinks);

    // Render links
    renderLinks(filteredLinks);

    // Render nodes
    renderNodes(filteredNodes);

    // Retain active path highlight if set
    if (activePathHighlightNodeId) {
      highlightConnectionPath(activePathHighlightNodeId, activePathTargetNodeId);
    }
  }

  // ==========================================
  // PATH HIGHLIGHTING & CONNECTION FLOW ENGINE
  // ==========================================
  function assemblePathData(nodeIdsList) {
    const nodeIdsSet = new Set(nodeIdsList);
    const linkKeysSet = new Set();
    const hops = [];

    for (let i = 0; i < nodeIdsList.length - 1; i++) {
      const fromId = nodeIdsList[i];
      const toId = nodeIdsList[i + 1];
      const fromNode = rawNodes.find(n => n.id === fromId);
      const toNode = rawNodes.find(n => n.id === toId);

      // Look for connecting link
      const link = rawLinks.find(l => 
        (l.source === fromId && l.target === toId) ||
        (l.source === toId && l.target === fromId)
      );

      if (link) {
        linkKeysSet.add(`${link.source}->${link.target}`);
        linkKeysSet.add(`${link.target}->${link.source}`);
      }

      hops.push({
        from: fromNode,
        to: toNode,
        link: link
      });
    }

    return {
      nodeIds: nodeIdsSet,
      linkKeys: linkKeysSet,
      hops: hops,
      orderedNodeIds: nodeIdsList
    };
  }

  function getPathToRoot(nodeId) {
    if (!nodeId) return null;
    const pathList = [];
    let curr = nodeId;
    const visited = new Set();
    while (curr && !visited.has(curr)) {
      visited.add(curr);
      pathList.push(curr);
      curr = clientParentMap[curr] || treeParentMap[curr];
    }
    return assemblePathData(pathList);
  }

  function findPathBetween(startId, endId) {
    if (!startId || !endId || startId === endId) return getPathToRoot(startId);

    // Trace startId to root
    const pathToRootA = [];
    let curr = startId;
    const visitedA = new Set();
    while (curr && !visitedA.has(curr)) {
      visitedA.add(curr);
      pathToRootA.push(curr);
      curr = clientParentMap[curr] || treeParentMap[curr];
    }

    // Trace endId to root
    const pathToRootB = [];
    curr = endId;
    const visitedB = new Set();
    while (curr && !visitedB.has(curr)) {
      visitedB.add(curr);
      pathToRootB.push(curr);
      curr = clientParentMap[curr] || treeParentMap[curr];
    }

    // Find lowest common ancestor
    let lca = null;
    for (let id of pathToRootB) {
      if (visitedA.has(id)) {
        lca = id;
        break;
      }
    }

    if (!lca) {
      return getPathToRoot(startId);
    }

    const indexLcaA = pathToRootA.indexOf(lca);
    const pathA = pathToRootA.slice(0, indexLcaA + 1);

    const indexLcaB = pathToRootB.indexOf(lca);
    const pathB = pathToRootB.slice(0, indexLcaB).reverse();

    const fullPathNodeIds = [...pathA, ...pathB];
    return assemblePathData(fullPathNodeIds);
  }

  function highlightConnectionPath(nodeId, targetNodeId = null) {
    if (!nodeId) {
      clearPathHighlight();
      return;
    }

    let pathData;
    if (targetNodeId && targetNodeId !== nodeId) {
      pathData = findPathBetween(nodeId, targetNodeId);
    } else {
      pathData = getPathToRoot(nodeId);
    }

    if (!pathData || pathData.orderedNodeIds.length === 0) return;

    activePathHighlightNodeId = nodeId;
    activePathTargetNodeId = targetNodeId;
    activePathData = pathData;

    // 1. Activate class on viewport
    viewport.classList.add('path-highlight-active');

    // 2. Update nodes in DOM
    const nodeEls = document.querySelectorAll('#nodes-group .node');
    nodeEls.forEach(el => {
      const id = el.id.replace('node-', '');
      if (id === nodeId) {
        el.classList.add('path-origin', 'in-path');
        el.classList.remove('path-destination');
      } else if (targetNodeId && id === targetNodeId) {
        el.classList.add('path-destination', 'in-path');
        el.classList.remove('path-origin');
      } else if (pathData.nodeIds.has(id)) {
        el.classList.add('in-path');
        el.classList.remove('path-origin', 'path-destination');
      } else {
        el.classList.remove('in-path', 'path-origin', 'path-destination');
      }
    });

    // 3. Update links in DOM
    const linkEls = document.querySelectorAll('#links-group .link-group');
    linkEls.forEach(el => {
      const key1 = `${el.dataset.source}->${el.dataset.target}`;
      const key2 = `${el.dataset.target}->${el.dataset.source}`;
      if (pathData.linkKeys.has(key1) || pathData.linkKeys.has(key2)) {
        el.classList.add('in-path');
      } else {
        el.classList.remove('in-path');
      }
    });

    // 4. Update HUD
    renderPathHud(nodeId, targetNodeId, pathData);
  }

  function clearPathHighlight() {
    activePathHighlightNodeId = null;
    activePathTargetNodeId = null;
    activePathData = null;

    viewport.classList.remove('path-highlight-active');

    document.querySelectorAll('#nodes-group .node').forEach(el => {
      el.classList.remove('in-path', 'path-origin', 'path-destination');
    });

    document.querySelectorAll('#links-group .link-group').forEach(el => {
      el.classList.remove('in-path');
    });

    const hud = document.getElementById('path-highlight-hud');
    if (hud) hud.style.display = 'none';

    if (selectedNode) {
      renderDetailCard(selectedNode);
    }
  }

  function renderPathHud(nodeId, targetNodeId, pathData) {
    const hud = document.getElementById('path-highlight-hud');
    if (!hud) return;

    const originNode = rawNodes.find(n => n.id === nodeId);
    if (!originNode) {
      hud.style.display = 'none';
      return;
    }

    const titleEl = document.getElementById('path-hud-title');
    const routeEl = document.getElementById('path-hud-route');

    const hopCount = pathData.hops.length;
    if (targetNodeId && targetNodeId !== nodeId) {
      const destNode = rawNodes.find(n => n.id === targetNodeId);
      titleEl.textContent = `Point-to-Point Path (${hopCount} hop${hopCount === 1 ? '' : 's'})`;
    } else {
      titleEl.textContent = `Path to Gateway (${hopCount} hop${hopCount === 1 ? '' : 's'})`;
    }

    const routeFragment = document.createDocumentFragment();
    pathData.orderedNodeIds.forEach((id, idx) => {
      const n = rawNodes.find(node => node.id === id);
      if (!n) return;
      const name = n.name || n.host || formatMacAddress(n.mac) || id;
      const nameEl = document.createElement('span');
      nameEl.className = 'hop-node';
      nameEl.textContent = name;
      routeFragment.appendChild(nameEl);
      if (idx < pathData.orderedNodeIds.length - 1) {
        const hop = pathData.hops[idx];
        if (hop && hop.link) {
          const p = hop.link.source_port || hop.link.target_port;
          if (p && p !== 'unknown') {
            const portBadge = document.createElement('span');
            portBadge.className = 'hop-port';
            portBadge.textContent = `[P${p}]`;
            routeFragment.appendChild(portBadge);
          }
        }
        const arrow = document.createElement('span');
        arrow.className = 'hop-arrow';
        arrow.textContent = '➔';
        routeFragment.appendChild(arrow);
        routeFragment.appendChild(document.createTextNode(' '));
      }
    });

    routeEl.replaceChildren(routeFragment);
    hud.style.display = 'block';
  }

  function renderLinks(filteredLinks) {
    const container = document.getElementById('links-group');
    container.replaceChildren();

    filteredLinks.forEach((link, idx) => {
      const sourceNode = nodes[link.source];
      const targetNode = nodes[link.target];
      if (!sourceNode || !targetNode) return;

      const isClientLink = link.type === 'client';
      const isWingLink = isClientLink || link.type === 'virtual_child';
      const x1 = sourceNode.x;
      const y1 = sourceNode.y;
      const x2 = targetNode.x;
      const y2 = targetNode.y;

      let sx, sy, cx, cy, pathData;

      if (isWingLink) {
        // Horizontal branching curve from parent switch into the side wing
        if (x2 < x1) {
          // Left Wing
          sx = x1 - 90;
          sy = y1;
          cx = x2 + 69;
          cy = y2;
        } else {
          // Right Wing
          sx = x1 + 90;
          sy = y1;
          cx = x2 - 69;
          cy = y2;
        }
        const midX = (sx + cx) / 2;
        pathData = `M ${sx} ${sy} C ${midX} ${sy}, ${midX} ${cy}, ${cx} ${cy}`;
      } else {
        const dy = y2 - y1;
        if (Math.abs(dy) < 25) {
          // Same-tier horizontal arch
          const archH = Math.min(80, Math.abs(x2 - x1) * 0.25 + 30);
          sx = x1;
          sy = y1 - 26;
          cx = x2;
          cy = y2 - 26;
          pathData = `M ${sx} ${sy} C ${sx} ${sy - archH}, ${cx} ${cy - archH}, ${cx} ${cy}`;
        } else if (dy > 0) {
          // Top to bottom
          sx = x1;
          sy = y1 + 26;
          cx = x2;
          cy = y2 - 26;
          const midY = (sy + cy) / 2;
          pathData = `M ${sx} ${sy} C ${sx} ${midY}, ${cx} ${midY}, ${cx} ${cy}`;
        } else {
          // Bottom to top
          sx = x1;
          sy = y1 - 26;
          cx = x2;
          cy = y2 + 26;
          const midY = (sy + cy) / 2;
          pathData = `M ${sx} ${sy} C ${sx} ${midY}, ${cx} ${midY}, ${cx} ${cy}`;
        }
      }

      const speedClass = `link-${safeCssToken((link.speed || '').toLowerCase().replace('/', '').replace('.', '_'))}`;
      let satClass = '';
      const utilPct = Math.max(0, Math.min(100, Number(link.utilization_pct) || 0));
      if (utilPct >= 80) satClass = 'link-saturated';
      else if (utilPct >= 50) satClass = 'link-moderate';

      const typeClass = `link-type-${safeCssToken(link.type || 'infra')}`;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', `link-group ${typeClass} ${speedClass} ${satClass}`.trim());
      g.setAttribute('id', `link-group-${idx}`);
      g.dataset.source = link.source;
      g.dataset.target = link.target;

      // Transparent thick background path for easier hovering
      const bgPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      bgPath.setAttribute('d', pathData);
      bgPath.setAttribute('class', 'link-bg');
      
      // Visible line
      const linePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      linePath.setAttribute('d', pathData);
      linePath.setAttribute('class', 'link-line');

      g.appendChild(bgPath);
      g.appendChild(linePath);

      // Marching dashes path (visible on backbone, or when highlighted on client wings)
      const marchPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      marchPath.setAttribute('d', pathData);
      marchPath.setAttribute('class', 'link-marching');
      
      const tx = link.tx_bps || 0;
      const rx = link.rx_bps || 0;
      const throughput = Math.max(tx, rx);
      if (throughput > 0) {
        const mbps = throughput / 1000000;
        const dur = Math.max(1.2, Math.min(15.0, 16.0 - Math.log10(Math.max(1, mbps) + 1) * 4.5));
        marchPath.style.animationDuration = `${dur.toFixed(1)}s`;
        if (rx > tx) {
          marchPath.style.animationDirection = 'reverse';
        }
      } else {
        marchPath.style.animationDuration = '25s';
      }

      if (isWingLink || !showMarching) marchPath.style.display = 'none';
      g.appendChild(marchPath);

      // Port badges strictly on backbone infrastructure links
      if (!isWingLink) {

        // Port badges at 25% and 75% along the curve
        if (link.source_port && link.source_port !== 'unknown') {
          const pt = getBezierPoint(0.25, sx, sy, cx, cy);
          g.appendChild(createPortBadge(pt.x, pt.y - 8, formatPortBadge(link.source_port), 'source-badge'));
        }
        if (link.target_port && link.target_port !== 'unknown') {
          const pt = getBezierPoint(0.75, sx, sy, cx, cy);
          g.appendChild(createPortBadge(pt.x, pt.y + 8, formatPortBadge(link.target_port), 'target-badge'));
        }

        // Live throughput HUD badge at midpoint if active traffic
        if (throughput >= 50000) {
          const midPt = getBezierPoint(0.5, sx, sy, cx, cy);
          g.appendChild(createTrafficBadge(midPt.x, midPt.y, formatTraffic(throughput)));
        }
      }

      // Tooltip triggers
      g.addEventListener('mouseenter', (e) => showLinkTooltip(e, link, sourceNode, targetNode));
      g.addEventListener('mouseleave', hideLinkTooltip);
      g.addEventListener('mousemove', moveLinkTooltip);

      container.appendChild(g);
    });
  }

  function createTrafficBadge(x, y, text) {
    const badge = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    badge.setAttribute('transform', `translate(${x - 22}, ${y - 6})`);

  // Cubic Bezier curve calculator
  function getBezierPoint(t, x1, y1, x2, y2) {
    const midY = (y1 + y2) / 2;
    const cx1 = x1;
    const cy1 = midY;
    const cx2 = x2;
    const cy2 = midY;

    const mt = 1 - t;
    const mt2 = mt * mt;
    const mt3 = mt2 * mt;
    const t2 = t * t;
    const t3 = t2 * t;

    const x = mt3 * x1 + 3 * mt2 * t * cx1 + 3 * mt * t2 * cx2 + t3 * x2;
    const y = mt3 * y1 + 3 * mt2 * t * cy1 + 3 * mt * t2 * cy2 + t3 * y2;

    return { x, y };
  }

  function createPortBadge(x, y, text, extraClass) {
    const badge = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    badge.setAttribute('transform', `translate(${x - 12}, ${y - 6})`);
    badge.style.pointerEvents = 'none';
    if (extraClass) {
      badge.setAttribute('class', `port-badge-group ${extraClass}`);
    } else {
      badge.setAttribute('class', 'port-badge-group');
    }

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('width', '24');
    rect.setAttribute('height', '12');
    rect.setAttribute('class', 'port-badge');

    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('x', '12');
    txt.setAttribute('y', '6');
    txt.setAttribute('class', 'port-badge-text');
    txt.textContent = text;

    badge.appendChild(rect);
    badge.appendChild(txt);
    return badge;
  }

  function formatMacAddress(mac) {
    if (!mac) return '';
    // Format MAC into standard colon-separated 6-byte notation
    const cleaned = mac.replace(/[^A-Fa-f0-9]/g, '').toUpperCase();
    if (cleaned.length === 12) {
      return cleaned.match(/.{2}/g).join(':');
    }
    return mac;
  }

  function formatPortDisplay(port) {
    if (port === null || port === undefined || port === '') return '';
    const s = String(port).trim();
    if (/^\d+$/.test(s)) return `Port ${parseInt(s, 10)}`;
    const m = s.match(/^(?:port|p|lan)[\s\-_:.]*(\d+)$/i);
    if (m) return `Port ${parseInt(m[1], 10)}`;
    return s;
  }

  function formatPortBadge(port) {
    if (port === null || port === undefined || port === '') return '';
    const s = String(port).trim();
    if (/^\d+$/.test(s)) return `P${parseInt(s, 10)}`;
    const m = s.match(/^(?:port|p|lan)[\s\-_:.]*(\d+)$/i);
    if (m) return `P${parseInt(m[1], 10)}`;
    const vm = s.match(/^vlan[\s\-_:.]*(\d+)$/i);
    if (vm) return `VLAN ${parseInt(vm[1], 10)}`;
    return s;
  }

  // ==========================================
  // DRAG & DROP FOR NODES
  // ==========================================
  function startDragNode(e, node) {
    e.stopPropagation();
    if (e.button !== 0) return; // Only left click
    
    draggedNode = node;
    
    // Transform coordinates based on current zoom scale & panning
    const mouseX = e.clientX;
    const mouseY = e.clientY;
    
    dragOffset.x = (mouseX / zoomScale) - node.x;
    dragOffset.y = (mouseY / zoomScale) - node.y;

    document.addEventListener('mousemove', dragNode);
    document.addEventListener('mouseup', stopDragNode);
  }

  function dragNode(e) {
    if (!draggedNode) return;
    
    const mouseX = e.clientX;
    const mouseY = e.clientY;
    
    const newX = (mouseX / zoomScale) - dragOffset.x;
    const newY = (mouseY / zoomScale) - dragOffset.y;
    
    draggedNode.x = newX;
    draggedNode.y = newY;
    
    // Save to position cache
    positionCache[draggedNode.id] = { x: newX, y: newY };
    
    // Update visual node position
    const nodeEl = document.getElementById(`node-${draggedNode.id}`);
    if (nodeEl) {
      nodeEl.setAttribute('transform', `translate(${newX}, ${newY})`);
    }

    // Redraw linking lines (very fast)
    processAndRender();
  }

  async function stopDragNode() {
    draggedNode = null;
    document.removeEventListener('mousemove', dragNode);
    document.removeEventListener('mouseup', stopDragNode);
    
    // Save to server config
    try {
      await fetch('/api/config/settings', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ map_positions: positionCache })
      });
    } catch (e) {
      console.error("Failed to save map coordinates to server:", e);
    }
  }

  // ==========================================
  // TOUCH DRAG & TAP FOR NODES
  // ==========================================
  let touchNodeState = null;

  function handleNodeTouchStart(e, node) {
    if (e.touches.length !== 1) {
      touchNodeState = null;
      return;
    }
    const t = e.touches[0];
    touchNodeState = {
      node: node,
      startX: t.clientX,
      startY: t.clientY,
      nodeX: node.x,
      nodeY: node.y,
      moved: false,
      startTime: Date.now()
    };
  }

  function handleNodeTouchMove(e) {
    if (!touchNodeState) return;
    if (e.touches.length !== 1) {
      if (touchNodeState.moved) {
        stopDragNode();
      }
      touchNodeState = null;
      return;
    }
    const t = e.touches[0];
    const dx = t.clientX - touchNodeState.startX;
    const dy = t.clientY - touchNodeState.startY;

    if (!touchNodeState.moved && Math.hypot(dx, dy) > 8) {
      touchNodeState.moved = true;
      draggedNode = touchNodeState.node;
      dragOffset.x = (touchNodeState.startX / zoomScale) - touchNodeState.node.x;
      dragOffset.y = (touchNodeState.startY / zoomScale) - touchNodeState.node.y;
    }

    if (touchNodeState.moved && draggedNode) {
      e.preventDefault();
      const mouseX = t.clientX;
      const mouseY = t.clientY;
      const newX = (mouseX / zoomScale) - dragOffset.x;
      const newY = (mouseY / zoomScale) - dragOffset.y;
      draggedNode.x = newX;
      draggedNode.y = newY;
      positionCache[draggedNode.id] = { x: newX, y: newY };
      const nodeEl = document.getElementById(`node-${draggedNode.id}`);
      if (nodeEl) nodeEl.setAttribute('transform', `translate(${newX}, ${newY})`);
      processAndRender();
    }
  }

  async function handleNodeTouchEnd(e) {
    if (!touchNodeState) return;
    const state = touchNodeState;
    touchNodeState = null;

    if (state.moved) {
      e.preventDefault();
      await stopDragNode();
    } else {
      // Tap on node: select & inspect
      e.preventDefault();
      selectNode(state.node);
    }
  }

  function handleNodeTouchCancel() {
    if (touchNodeState && touchNodeState.moved) {
      stopDragNode();
    }
    touchNodeState = null;
  }

  document.addEventListener('touchmove', handleNodeTouchMove, { passive: false });
  document.addEventListener('touchend', handleNodeTouchEnd);
  document.addEventListener('touchcancel', handleNodeTouchCancel);

  // ==========================================
  // ZOOM & PAN CANVAS (MOUSE & TOUCH)
  // ==========================================
  let panMoved = false;
  let canvasStartPos = { x: 0, y: 0 };

  canvasContainer.addEventListener('mousedown', (e) => {
    if (e.target === svg || e.target.id === 'map-svg' || e.target.tagName === 'svg' || e.target.classList.contains('link-bg') || e.target === viewport) {
      isDraggingCanvas = true;
      panMoved = false;
      canvasStartPos = { x: e.clientX, y: e.clientY };
      canvasStartPan.x = e.clientX - panX;
      canvasStartPan.y = e.clientY - panY;
      document.addEventListener('mousemove', panCanvas);
      document.addEventListener('mouseup', stopPanCanvas);
    }
  });

  function panCanvas(e) {
    if (!isDraggingCanvas) return;
    if (Math.hypot(e.clientX - canvasStartPos.x, e.clientY - canvasStartPos.y) > 4) {
      panMoved = true;
    }
    panX = e.clientX - canvasStartPan.x;
    panY = e.clientY - canvasStartPan.y;
    updateViewportTransform();
  }

  function stopPanCanvas() {
    isDraggingCanvas = false;
    document.removeEventListener('mousemove', panCanvas);
    document.removeEventListener('mouseup', stopPanCanvas);
    if (!panMoved) {
      clearPathHighlight();
    }
  }

  // Touch Gestures on Canvas: 1-Finger Pan, 2-Finger Pinch Zoom, Double-Tap
  let isTouchPanning = false;
  let isTouchPinching = false;
  let touchPanMoved = false;
  let touchPanStart = { x: 0, y: 0 };
  let initialPinchDist = 0;
  let initialPinchZoom = 1;
  let initialPinchMid = { x: 0, y: 0 };
  let initialPinchPan = { x: 0, y: 0 };
  let lastCanvasTapTime = 0;
  let lastCanvasTapPos = { x: 0, y: 0 };

  canvasContainer.addEventListener('touchstart', (e) => {
    if (e.target.closest('.node') || e.target.closest('.map-controls') || e.target.closest('.top-toolbar') || e.target.closest('.path-hud') || e.target.closest('.legend-bar')) {
      return;
    }

    if (e.touches.length === 1) {
      isTouchPanning = true;
      touchPanMoved = false;
      touchPanStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      canvasStartPan.x = e.touches[0].clientX - panX;
      canvasStartPan.y = e.touches[0].clientY - panY;
    } else if (e.touches.length === 2) {
      isTouchPanning = false;
      isTouchPinching = true;
      touchNodeState = null;
      e.preventDefault();
      
      const t1 = e.touches[0];
      const t2 = e.touches[1];
      initialPinchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      initialPinchZoom = zoomScale;
      initialPinchMid = { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
      initialPinchPan = { x: panX, y: panY };
    }
  }, { passive: false });

  canvasContainer.addEventListener('touchmove', (e) => {
    if (touchNodeState && touchNodeState.moved) return;
    if (e.target.closest('.map-controls') || e.target.closest('.top-toolbar') || e.target.closest('.path-hud')) return;

    if (isTouchPinching && e.touches.length === 2) {
      e.preventDefault();
      const t1 = e.touches[0];
      const t2 = e.touches[1];
      const currentDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      const currentMid = { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };

      if (initialPinchDist > 0) {
        const factor = currentDist / initialPinchDist;
        const newScale = Math.min(Math.max(initialPinchZoom * factor, 0.15), 4);

        const rect = canvasContainer.getBoundingClientRect();
        const cx = initialPinchMid.x - rect.left;
        const cy = initialPinchMid.y - rect.top;

        let px = cx - (cx - initialPinchPan.x) * (newScale / initialPinchZoom);
        let py = cy - (cy - initialPinchPan.y) * (newScale / initialPinchZoom);

        px += (currentMid.x - initialPinchMid.x);
        py += (currentMid.y - initialPinchMid.y);

        panX = px;
        panY = py;
        zoomScale = newScale;
        updateViewportTransform();
      }
    } else if (isTouchPanning && e.touches.length === 1) {
      const dist = Math.hypot(e.touches[0].clientX - touchPanStart.x, e.touches[0].clientY - touchPanStart.y);
      if (dist > 6) touchPanMoved = true;
      if (touchPanMoved) {
        e.preventDefault();
        panX = e.touches[0].clientX - canvasStartPan.x;
        panY = e.touches[0].clientY - canvasStartPan.y;
        updateViewportTransform();
      }
    }
  }, { passive: false });

  canvasContainer.addEventListener('touchend', (e) => {
    if (isTouchPinching) {
      if (e.touches.length < 2) {
        isTouchPinching = false;
        if (e.touches.length === 1) {
          isTouchPanning = true;
          touchPanMoved = true;
          canvasStartPan.x = e.touches[0].clientX - panX;
          canvasStartPan.y = e.touches[0].clientY - panY;
        }
      }
    } else if (isTouchPanning) {
      if (e.touches.length === 0) {
        isTouchPanning = false;
        if (!touchPanMoved && !touchNodeState) {
          const now = Date.now();
          const changedTouch = e.changedTouches[0];
          if (now - lastCanvasTapTime < 320 && Math.hypot(changedTouch.clientX - lastCanvasTapPos.x, changedTouch.clientY - lastCanvasTapPos.y) < 30) {
            // Double tap zoom
            if (zoomScale > 1.3) {
              resetZoom();
            } else {
              zoom(1.6, changedTouch.clientX, changedTouch.clientY);
            }
            lastCanvasTapTime = 0;
          } else {
            lastCanvasTapTime = now;
            lastCanvasTapPos = { x: changedTouch.clientX, y: changedTouch.clientY };
            clearPathHighlight();
            if (window.innerWidth <= 900) {
              toggleSidebar(false);
            }
          }
        }
      }
    }
  });

  canvasContainer.addEventListener('touchcancel', () => {
    isTouchPanning = false;
    isTouchPinching = false;
  });

  // Clear path highlight on Escape key
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        document.activeElement.blur();
        return;
      }
      clearPathHighlight();
      if (window.innerWidth <= 900) {
        toggleSidebar(false);
      }
    }
  });

  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
    zoom(zoomFactor, e.clientX, e.clientY);
  }, { passive: false });

  function zoom(factor, centerX = null, centerY = null) {
    const newScale = Math.min(Math.max(zoomScale * factor, 0.15), 4);
    
    const containerRect = canvasContainer.getBoundingClientRect();
    const cx = centerX !== null ? (centerX - containerRect.left) : (canvasContainer.clientWidth / 2);
    const cy = centerY !== null ? (centerY - containerRect.top) : (canvasContainer.clientHeight / 2);
    
    panX = cx - (cx - panX) * (newScale / zoomScale);
    panY = cy - (cy - panY) * (newScale / zoomScale);
    
    zoomScale = newScale;
    updateViewportTransform();
  }

  function resetZoom() {
    const containerWidth = canvasContainer.clientWidth;
    const containerHeight = canvasContainer.clientHeight;
    const mapWidth = Math.max(mapBounds.maxX - mapBounds.minX, 400);
    const mapHeight = Math.max(mapBounds.maxY - mapBounds.minY, 300);

    const scaleX = (containerWidth - 80) / mapWidth;
    const scaleY = (containerHeight - 100) / mapHeight;
    zoomScale = Math.min(Math.max(Math.min(scaleX, scaleY, 1.0), 0.25), 1.1);

    const midX = (mapBounds.minX + mapBounds.maxX) / 2;
    panX = containerWidth / 2 - midX * zoomScale;
    panY = Math.max(30, (containerHeight - mapHeight * zoomScale) / 3);
    updateViewportTransform();
  }

  function updateViewportTransform() {
    viewport.setAttribute('transform', `translate(${panX}, ${panY}) scale(${zoomScale})`);
  }
